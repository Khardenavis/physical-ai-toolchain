version: '3.8'

services:
  odd-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: odd-component:latest
    container_name: odd-pipeline
    network_mode: host
    environment:
      - VLM_URL=http://localhost:8010/v1
      - VLM_MODEL=nvidia/Cosmos-Reason2-2B
      - ODD_SCORE_THRESHOLD=0.8
    volumes:
      - ../nvidia_nurec:/input:ro
      - ../nvidia_nurec/test_output:/output
    command: >
      --input-dir /input
      --output-dir /output
      --threshold 0.8
      --host-video-dir /mnt/paidf-augmentation/nvidia_nurec/physical_ai_videos
